name: Validate and Package Skill

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  validate:
    name: Validate Skill Structure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
    
    - name: Check SKILL.md exists
      run: |
        if [ ! -f "SKILL.md" ]; then
          echo "Error: SKILL.md not found"
          exit 1
        fi
    
    - name: Validate YAML frontmatter
      run: |
        python -c "
        import re
        with open('SKILL.md', 'r') as f:
            content = f.read()
            if not content.startswith('---'):
                print('Error: SKILL.md must start with YAML frontmatter')
                exit(1)
            if 'name: chatbot-seo' not in content:
                print('Error: name field must be present in frontmatter')
                exit(1)
            if 'description:' not in content:
                print('Error: description field must be present in frontmatter')
                exit(1)
        print('✓ YAML frontmatter is valid')
        "
    
    - name: Test audit script
      run: |
        echo "Testing audit script..."
        python scripts/audit_content.py README.md || echo "Script test completed"
    
    - name: Test schema generator
      run: |
        echo "Testing schema generator..."
        echo "5" | python scripts/schema_generator.py || echo "Script test completed"
    
    - name: Validate JSON files
      run: |
        python -c "
        import json
        with open('skill.json', 'r') as f:
            data = json.load(f)
            print(f'✓ skill.json is valid')
            print(f'  Name: {data.get(\"name\")}')
            print(f'  Version: {data.get(\"version\")}')
        "

  test-scripts:
    name: Test Python Scripts
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
    
    - name: Create test HTML file
      run: |
        cat > test.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>Test Article - Updated Jan 2024</title>
            <meta name="description" content="This is a test article for chatbot SEO optimization.">
            <meta name="author" content="Test Author">
        </head>
        <body>
            <h1>What is Chatbot SEO?</h1>
            <p>Chatbot SEO is the practice of optimizing content for AI-powered search engines. Studies show that 73% of users now use AI assistants for research.</p>
            <h2>Key Benefits</h2>
            <ul>
                <li>Increased visibility in AI search</li>
                <li>Better citation rates</li>
            </ul>
        </body>
        </html>
        EOF
    
    - name: Run audit on test file
      run: |
        python scripts/audit_content.py test.html
    
    - name: Verify audit output
      run: |
        output=$(python scripts/audit_content.py test.html)
        if [[ $output == *"OVERALL SCORE"* ]]; then
          echo "✓ Audit script produces expected output"
        else
          echo "✗ Audit script output is invalid"
          exit 1
        fi

  package:
    name: Package Skill
    runs-on: ubuntu-latest
    needs: [validate, test-scripts]
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Create .skill package
      run: |
        mkdir -p dist
        zip -r "dist/chatbot-seo-${{ github.event.release.tag_name }}.skill" \
          SKILL.md \
          scripts/ \
          references/ \
          README.md \
          LICENSE \
          skill.json \
          -x "*.pyc" "__pycache__/*" ".git/*"
    
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./dist/chatbot-seo-${{ github.event.release.tag_name }}.skill
        asset_name: chatbot-seo-${{ github.event.release.tag_name }}.skill
        asset_content_type: application/zip

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Lint markdown files
      uses: nosborn/github-action-markdown-cli@v3.3.0
      with:
        files: .
        config_file: .markdownlint.json
        ignore_files: node_modules/
      continue-on-error: true
